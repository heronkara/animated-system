<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fitness">
<meta name="theme-color" content="#111318">
<title>Fitness Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:#111318;color:#e8eaed;min-height:100vh;overflow-x:hidden}
#app{max-width:480px;margin:0 auto;padding:12px 16px 90px}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#1a1d24;border-top:1px solid #2a2e38;z-index:99}
.tabs{max-width:480px;margin:0 auto}
.tab{flex:1;padding:10px 0;border:none;cursor:pointer;font-size:9px;font-weight:600;background:none;color:#5f6673;text-align:center;border-top:2px solid transparent}
.tab.on{color:#7c5cfc;border-top-color:#7c5cfc}
.tab em{font-style:normal;font-size:18px;display:block;margin-bottom:2px}
.cd{background:#1a1d24;border-radius:16px;margin-bottom:12px;overflow:hidden;border:1px solid #2a2e38}
.cd-p{padding:16px}
.hd{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2a2e38}
.rw{display:flex;align-items:center;gap:12px;padding:11px 16px;border-bottom:1px solid #111318;cursor:pointer;transition:background .15s}
.rw.dn{background:rgba(124,92,252,.06)}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid #2a2e38;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck.on{border:none;background:linear-gradient(135deg,#7c5cfc,#22d3ee)}
.bg{font-size:10px;padding:3px 8px;border-radius:6px;background:#2a2e38;color:#fff;font-weight:700}
.inp{background:#22262e;border:1px solid #2a2e38;border-radius:10px;padding:12px 14px;color:#e8eaed;font-size:15px;width:100%;outline:none}
.btn{background:#7c5cfc;border:none;border-radius:10px;padding:12px 24px;color:#fff;font-weight:600;font-size:14px;cursor:pointer}
.btn-s{padding:6px 12px;font-size:11px;border-radius:8px}
.st{background:#22262e;padding:12px;border-radius:12px;text-align:center}
.vid{background:#ff0000;border-radius:6px;padding:5px 8px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;color:#fff;font-size:10px;font-weight:700;flex-shrink:0}
.prg{height:6px;border-radius:3px;background:#2a2e38;overflow:hidden}
.prg-f{height:100%;border-radius:3px;transition:width .3s}
.gr{background:linear-gradient(90deg,#7c5cfc,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.hide{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div class="tabs" id="tabs"></div>

<script>
// === DATA ===
const SUPPS=[
{g:"sabah",l:"☀️ Sabah (suya at, iç)",h:"Her gün — kalk, suya at, iç. 30 saniye.",c:"#7c5cfc",items:[
{id:"kreatin",ad:"Kreatin",doz:"5g",n:"Her gün. Suya at."},{id:"glutamin",ad:"Glutamin",doz:"5g",n:"Her gün. Kreatinle."},{id:"tongkat",ad:"Tongkat Ali",doz:"1g",n:"4 hafta al, 1 hafta ara."}]},
{g:"yemek",l:"🍽️ Yemekle (kapsül yut)",h:"Her gün — öğle veya akşam yemekte.",c:"#fb923c",items:[
{id:"omega",ad:"Omega-3",doz:"2-3g",n:"Yağlı yemekle."},{id:"d3k2",ad:"D3+K2",doz:"2000IU+100mcg",n:"Omega ile birlikte."}]},
{g:"gece",l:"🌙 Gece (yatmadan)",h:"Her gün — yatmadan 30dk önce.",c:"#22d3ee",items:[
{id:"kazein",ad:"Kazein",doz:"30g",n:"Su veya sütle. Gece boyu kas koruma."}]},
{g:"gym",l:"💪 Gym günü ekstra",h:"SADECE antrenman günü — yoksa atla.",c:"#f472b6",items:[
{id:"sitrulin",ad:"Sitrülin Malat",doz:"6-8g",n:"30dk önce suyla."}]}

const WK=[
{nm:"H1 — Klasik Güçlü",days:[

{d:"LEGS",h:[{a:"Barbell Squat",s:"4x6-8",v:"https://www.youtube.com/watch?v=ultWZbUMPL8"},{a:"Romanian Deadlift",s:"3x8-10",v:"https://www.youtube.com/watch?v=7j-2w4-P14I"},{a:"Leg Press",s:"3x10-12",v:"https://www.youtube.com/watch?v=IZxyjW7MPJQ"},{a:"Leg Curl",s:"3x10-12",v:"https://www.youtube.com/watch?v=1Tq3QdYUuHs"},{a:"Cable Woodchop",s:"3x12/yön",v:"https://www.youtube.com/watch?v=pAplQXk3dkU"},{a:"Plank",s:"3x45-60sn",v:"https://www.youtube.com/watch?v=ASdvN_XEl_c"}]}]},
{nm:"H2 — Makine Avcısı",days:[
{d:"PUSH",h:[{a:"Smith Incline Press",s:"4x8-10",v:"https://www.youtube.com/watch?v=EUkkdMwUbHo"},{a:"Machine Shoulder Press",s:"3x8-10",v:"https://www.youtube.com/watch?v=Wqq43dKoG2Q"},{a:"Pec Deck",s:"3x12-15",v:"https://www.youtube.com/watch?v=Z57CtFmRMxA"},{a:"Cable Lateral Raise",s:"4x12-15",v:"https://www.youtube.com/watch?v=PPrzBWoG5g4"},{a:"Dip Machine",s:"3x10-12",v:"https://www.youtube.com/watch?v=nEF0bv2FW94"},{a:"Cable Tri Kickback",s:"2x12-15",v:"https://www.youtube.com/watch?v=ShCYaoHmWCk"}]},
{d:"PULL",h:[{a:"T-Bar Row",s:"4x8-10",v:"https://www.youtube.com/watch?v=j3Igk5nyZE4"},{a:"Close Grip Pulldown",s:"3x8-10",v:"https://www.youtube.com/watch?v=ecRF8ERf2q4"},{a:"Single Arm DB Row",s:"3x10-12",v:"https://www.youtube.com/watch?v=roCP6wCXPqo"},{a:"Reverse Fly Machine",s:"3x12-15",v:"https://www.youtube.com/watch?v=oLrBdSIi5TU"},{a:"Incline DB Curl",s:"3x10-12",v:"https://www.youtube.com/watch?v=soxrZlIl35U"},{a:"Cable Curl",s:"2x12-15",v:"https://www.youtube.com/watch?v=NFzTWp2qpiE"}]},
{d:"LEGS",h:[{a:"Hack Squat",s:"4x8-10",v:"https://www.youtube.com/watch?v=0tn5K9NlCfo"},{a:"Dambıl RDL",s:"3x10-12",v:"https://www.youtube.com/watch?v=FQKfr1YDhEk"},{a:"Walking Lunges",s:"3x12/bacak",v:"https://www.youtube.com/watch?v=D7KaRcUTQeE"},{a:"Leg Extension",s:"3x12-15",v:"https://www.youtube.com/watch?v=YyvSfVjQeL0"},{a:"Hanging Leg Raise",s:"3x10-15",v:"https://www.youtube.com/watch?v=hdng3Nm1x_E"},{a:"Ab Wheel",s:"3x10-15",v:"https://www.youtube.com/watch?v=S0gNh3LXMN0"}]}]},
{nm:"H3 — Hacim Bombası",days:[
{d:"PUSH",h:[{a:"Dambıl Bench Press",s:"4x8-10",v:"https://www.youtube.com/watch?v=VmB1G1K7v94"},{a:"Arnold Press",s:"3x10-12",v:"https://www.youtube.com/watch?v=6Z15_WdXmVw"},{a:"Cable Fly Alt→Üst",s:"3x12-15",v:"https://www.youtube.com/watch?v=Iwe6AmxVf7o"},{a:"Lateral Raise Drop",s:"3x12+8+6",v:"https://www.youtube.com/watch?v=3VcKaXpzqRo"},{a:"Skull Crusher",s:"3x10-12",v:"https://www.youtube.com/watch?v=d_KZxkY_0cM"},{a:"Diamond Push-up",s:"2xmax",v:"https://www.youtube.com/watch?v=J0DnG1_S3lg"}]},
{d:"PULL",h:[{a:"Pendlay Row",s:"4x6-8",v:"https://www.youtube.com/watch?v=Weu9HMHdiDA"},{a:"Pull-up",s:"3x6-10",v:"https://www.youtube.com/watch?v=eGo4IYlbE5g"},{a:"Meadows Row",s:"3x10-12",v:"https://www.youtube.com/watch?v=IjMuLsBEfEo"},{a:"Dambıl Shrug",s:"3x10-12",v:"https://www.youtube.com/watch?v=cJRVVxmytaM"},{a:"Preacher Curl",s:"3x10-12",v:"https://www.youtube.com/watch?v=fIWP-FRFNU0"},{a:"Reverse Curl",s:"2x12-15",v:"https://www.youtube.com/watch?v=nRgxYX2Ve9w"}]},
{d:"LEGS",h:[{a:"Front Squat",s:"4x6-8",v:"https://www.youtube.com/watch?v=m4ytaCJZpl0"},{a:"Sumo Deadlift",s:"3x6-8",v:"https://www.youtube.com/watch?v=_XyCmKFarmg"},{a:"Bulgarian Split Squat",s:"3x10/bacak",v:"https://www.youtube.com/watch?v=2C-uNgKwPLE"},{a:"Seated Leg Curl",s:"3x10-12",v:"https://www.youtube.com/watch?v=1Tq3QdYUuHs"},{a:"Pallof Press",s:"3x12/yön",v:"https://www.youtube.com/watch?v=AH_QZLm_0-s"},{a:"Farmer's Walk",s:"3x30-40m",v:"https://www.youtube.com/watch?v=Fkzk_RqlYig"}]}]},
{nm:"H4 — Savaşçı Modu",days:[
{d:"PUSH",h:[{a:"Close Grip Bench",s:"4x6-8",v:"https://www.youtube.com/watch?v=nEF0bv2FW94"},{a:"Landmine Press",s:"3x8-10",v:"https://www.youtube.com/watch?v=Oy3g8A3grYo"},{a:"Incline Cable Fly",s:"3x12-15",v:"https://www.youtube.com/watch?v=Iwe6AmxVf7o"},{a:"Lu Raise",s:"3x10",v:"https://www.youtube.com/watch?v=d3Cc27ULGWI"},{a:"Dips",s:"3x8-12",v:"https://www.youtube.com/watch?v=2z8JmcrW-As"},{a:"Single Arm Tri Push",s:"2x12/kol",v:"https://www.youtube.com/watch?v=2-LAMcpzODU"}]},
{d:"PULL",h:[{a:"Deadlift",s:"4x5",v:"https://www.youtube.com/watch?v=op9kVnSso6Q"},{a:"Chest Supported Row",s:"3x10-12",v:"https://www.youtube.com/watch?v=H75im3p3ZkM"},{a:"Straight Arm Pulldown",s:"3x12-15",v:"https://www.youtube.com/watch?v=AjCCGN2k7P0"},{a:"Face Pull",s:"3x15-20",v:"https://www.youtube.com/watch?v=rep-qVOkqgk"},{a:"Spider Curl",s:"3x10-12",v:"https://www.youtube.com/watch?v=BIFGLILCpHo"},{a:"Zottman Curl",s:"2x10-12",v:"https://www.youtube.com/watch?v=ZrpRBgswtHs"}]},
{d:"LEGS",h:[{a:"Trap Bar Deadlift",s:"4x6-8",v:"https://www.youtube.com/watch?v=cf5bqQHTORI"},{a:"Hip Thrust",s:"3x10-12",v:"https://www.youtube.com/watch?v=SEdqd1n0cvg"},{a:"Step-up",s:"3x10/bacak",v:"https://www.youtube.com/watch?v=dQqApCGd5Ss"},{a:"Nordic Curl",s:"3x6-10",v:"https://www.youtube.com/watch?v=BLW1EAPOfd4"},{a:"Cable Woodchop",s:"3x12/yön",v:"https://www.youtube.com/watch?v=pAplQXk3dkU"},{a:"Dead Bug",s:"3x10/taraf",v:"https://www.youtube.com/watch?v=4XLEnwUr1d8"}]}]}
];

// === STORAGE ===
function ld(k,def){try{const v=localStorage.getItem("ft_"+k);return v?JSON.parse(v):def}catch(e){return def}}
function sv(k,v){try{localStorage.setItem("ft_"+k,JSON.stringify(v))}catch(e){}}
const dk=()=>new Date().toISOString().slice(0,10);

// === STATE ===
let tab=0, suppLog=ld("supp",{}), kiloLog=ld("kilo",[{tarih:"8 Nis",kg:138},{tarih:"27 May",kg:128.8},{tarih:"7 Haz",kg:126.6},{tarih:"24 Haz",kg:122.9},{tarih:"4 Ağu",kg:117.2},{tarih:"21 Ağu",kg:115.5},{tarih:"2 Eki",kg:115.3},{tarih:"3 Kas",kg:115},{tarih:"30 Kas",kg:113},{tarih:"16 Şub",kg:110.4}]);
let gymCk=ld("gym",{}), wkIdx=ld("wk",0), dayIdx=0, streak=ld("str",0), best=ld("bst",0);

function saveAll(){sv("supp",suppLog);sv("kilo",kiloLog);sv("gym",gymCk);sv("wk",wkIdx);sv("str",streak);sv("bst",best)}

// === HELPERS ===
const $=id=>document.getElementById(id);
const el=(t,cls,html)=>{const e=document.createElement(t);if(cls)e.className=cls;if(html!==undefined)e.innerHTML=html;return e};
const allSuppIds=SUPPS.flatMap(g=>g.items.map(i=>i.id));
const todaySupp=()=>suppLog[dk()]||{};
const suppDone=()=>allSuppIds.filter(id=>todaySupp()[id]).length;
const suppTotal=()=>allSuppIds.length;
const lastKg=()=>kiloLog.length?kiloLog[kiloLog.length-1].kg:null;

// === RENDER ===
function render(){
  const app=$("app");app.innerHTML="";
  // Header
  const hdr=el("div","",`<h1 style="font-size:22px;font-weight:800" class="gr">Fitness Tracker</h1><p style="font-size:12px;color:#5f6673;margin-top:2px">${lastKg()?lastKg()+" kg":"—"} → 100 kg</p>`);
  hdr.style.marginBottom="16px";app.appendChild(hdr);

  if(tab===0) renderHome(app);
  if(tab===1) renderSupp(app);
  if(tab===2) renderKilo(app);
  if(tab===3) renderGym(app);

  // Footer
  const ft=el("div","",`<p style="font-size:10px;color:#ef4444;font-style:italic;opacity:.25">harun ekini çok seviyor ❤️</p>`);
  ft.style.textAlign="center";ft.style.padding="16px 0";app.appendChild(ft);
  renderTabs();
}

function renderTabs(){
  const tb=$("tabs");tb.innerHTML="";
  ["🏠|Ana","💊|Supp","⚖️|Kilo","🏋️|Gym"].forEach((t,i)=>{
    const[em,lb]=t.split("|");
    const b=el("button","tab"+(tab===i?" on":""),`<em>${em}</em>${lb}`);
    b.onclick=()=>{tab=i;render()};tb.appendChild(b);
  });
}

function renderHome(app){
  // Manifesto
  const m=el("div","cd");m.style.borderLeft="3px solid #7c5cfc";m.style.background="linear-gradient(135deg,#1a1d24,#111318)";
  m.innerHTML=`<div class="cd-p"><p style="font-size:15px;font-weight:800;color:#7c5cfc;margin-bottom:8px">🎯 MANIFESTO</p>
<p style="font-size:13px;color:#e8eaed;line-height:1.7;margin-bottom:8px">138 kg'dan buraya geldin. 30 kilo verdin. Bu iş bitecek.</p>
<p style="font-size:12px;color:#fb923c;line-height:1.8">1. Her öğünde protein ol — proteinsiz öğün yok.</p>
<p style="font-size:12px;color:#fb923c;line-height:1.8">2. Akşam karbı azalt — pilav/ekmek sabah-öğlene.</p>
<p style="font-size:12px;color:#fb923c;line-height:1.8;margin-bottom:8px">3. Kırma gelince → kazein iç, badem ye, yat.</p>
<p style="font-size:11px;color:#5f6673;font-style:italic">Kalori sayma, takıntı yapma. 3 kuralı tut, kilo düşer.</p></div>`;
  app.appendChild(m);

  // Streak
  const sd=suppDone(),st=suppTotal(),pct=Math.round((sd/st)*100);
  const s=el("div","cd");
  s.innerHTML=`<div class="cd-p"><div style="display:flex;align-items:center;gap:12px;margin-bottom:12px">
<span style="font-size:36px">🔥</span><div><div style="font-size:28px;font-weight:800;color:${streak>0?"#fb923c":"#5f6673"}">${streak} Gün</div><div style="font-size:11px;color:#5f6673">Supplement streak</div></div>
<div style="margin-left:auto;text-align:right"><div style="font-size:20px;font-weight:700;color:#fbbf24">🏆 ${best}</div><div style="font-size:10px;color:#5f6673">En iyi</div></div></div>
<div class="prg"><div class="prg-f" style="width:${pct}%;background:linear-gradient(90deg,#7c5cfc,#22d3ee)"></div></div></div>`;
  app.appendChild(s);

  // Stats
  const sg=el("div","",``);sg.style.cssText="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px";
  const lk=lastKg();
  [{l:"Bugün Supp",v:pct+"%",c:pct===100?"#34d399":"#7c5cfc"},{l:"Güncel Kilo",v:lk?lk+" kg":"—",c:"#22d3ee"},
   {l:"Verilen",v:lk?(138-lk).toFixed(1)+" kg":"—",c:"#34d399"},{l:"Hedefe Kalan",v:lk?(lk-100).toFixed(1)+" kg":"—",c:"#f472b6"}].forEach(x=>{
    const b=el("div","st",`<div style="font-size:11px;color:#5f6673">${x.l}</div><div style="font-size:22px;font-weight:800;color:${x.c}">${x.v}</div>`);
    sg.appendChild(b);});
  app.appendChild(sg);

  // Week info
  const wi=el("div","cd");wi.innerHTML=`<div class="cd-p"><p style="font-size:13px;font-weight:700;margin-bottom:8px">📋 Bu Hafta: ${WK[wkIdx].nm}</p><p style="font-size:12px;color:#5f6673;line-height:1.6">Gym sekmesinden günü seç, hareketleri tamamla. Her hafta farklı — sıkılma yok.</p></div>`;
  app.appendChild(wi);
}

function renderSupp(app){
  const sd=suppDone(),st=suppTotal(),pct=Math.round((sd/st)*100);
  const p=el("div","cd");p.innerHTML=`<div class="cd-p"><div style="display:flex;justify-content:space-between;margin-bottom:6px"><span style="font-size:13px;color:#9aa0ac">Bugün</span><span style="font-size:13px;font-weight:700;color:${pct===100?"#34d399":"#7c5cfc"}">${sd}/${st}</span></div><div class="prg"><div class="prg-f" style="width:${pct}%;background:${pct===100?"#34d399":"#7c5cfc"}"></div></div></div>`;
  app.appendChild(p);

  const ts=todaySupp();
  SUPPS.forEach(g=>{
    const gc=el("div","cd");
    let hdr=`<div class="hd"><span style="font-size:14px;font-weight:700;color:${g.c}">${g.l}</span><span style="font-size:11px;color:#5f6673">${g.items.filter(i=>ts[i.id]).length}/${g.items.length}</span></div>`;
    hdr+=`<div style="padding:4px 16px 8px;font-size:11px;color:#5f6673;font-style:italic">${g.h}</div>`;
    g.items.forEach(item=>{
      const dn=ts[item.id];
      hdr+=`<div class="rw${dn?" dn":""}" data-sid="${item.id}"><div class="ck${dn?" on":""}">${dn?"✓":""}</div><div style="flex:1"><span style="font-size:14px;font-weight:500;color:${dn?"#5f6673":"#e8eaed"};text-decoration:${dn?"line-through":"none"};display:block">${item.ad}</span><span style="font-size:10px;color:#5f6673">${item.n}</span></div><span class="bg">${item.doz}</span></div>`;
    });
    gc.innerHTML=hdr;
    gc.querySelectorAll(".rw").forEach(r=>{r.onclick=()=>{
      const id=r.dataset.sid;const d=dk();
      if(!suppLog[d])suppLog[d]={};suppLog[d][id]=!suppLog[d][id];
      if(suppDone()===suppTotal()){streak++;if(streak>best)best=streak}
      saveAll();render();
    }});
    app.appendChild(gc);
  });
}

function renderKilo(app){
  // Chart
  const cc=el("div","cd");
  if(kiloLog.length>=2){
    const cv=document.createElement("canvas");cv.width=440;cv.height=200;cv.style.cssText="width:100%;height:auto;border-radius:8px";
    cc.innerHTML=`<div class="cd-p"><p style="font-size:14px;font-weight:700;margin-bottom:10px">📊 Kilo Grafiği</p></div>`;
    cc.querySelector(".cd-p").appendChild(cv);
    app.appendChild(cc);
    setTimeout(()=>{
      const ctx=cv.getContext("2d"),W=cv.width,H=cv.height;
      const vals=kiloLog.map(d=>d.kg),mn=Math.min(...vals)-2,mx=Math.max(...vals)+2;
      const xS=(W-60)/(vals.length-1),yS=(H-40)/(mx-mn);
      ctx.strokeStyle="#2a2e38";ctx.lineWidth=1;
      for(let i=0;i<4;i++){const y=20+i*((H-40)/3);ctx.beginPath();ctx.moveTo(40,y);ctx.lineTo(W-10,y);ctx.stroke();ctx.fillStyle="#5f6673";ctx.font="10px system-ui";ctx.textAlign="right";ctx.fillText((mx-(i*(mx-mn)/3)).toFixed(0),36,y+4)}
      const grd=ctx.createLinearGradient(0,0,W,0);grd.addColorStop(0,"#7c5cfc");grd.addColorStop(1,"#22d3ee");
      ctx.beginPath();ctx.strokeStyle=grd;ctx.lineWidth=2.5;
      vals.forEach((v,i)=>{const x=40+i*xS,y=20+(mx-v)*yS;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y)});ctx.stroke();
      vals.forEach((v,i)=>{const x=40+i*xS,y=20+(mx-v)*yS;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fillStyle="#7c5cfc";ctx.fill()});
      kiloLog.forEach((d,i)=>{if(i%Math.max(1,Math.ceil(kiloLog.length/6))===0||i===kiloLog.length-1){ctx.fillStyle="#5f6673";ctx.font="9px system-ui";ctx.textAlign="center";ctx.fillText(d.tarih,40+i*xS,H-4)}});
    },50);
  }else{cc.innerHTML=`<div class="cd-p"><p style="font-size:12px;color:#5f6673;text-align:center;padding:20px">En az 2 kayıt gerekli</p></div>`;app.appendChild(cc)}

  // Input
  const ic=el("div","cd");ic.innerHTML=`<div class="cd-p"><p style="font-size:14px;font-weight:700;margin-bottom:10px">➕ Kilo Ekle</p><div style="display:flex;gap:8px"><input class="inp" id="kInp" type="number" step="0.1" placeholder="Kilo (kg)" style="flex:1"><button class="btn" id="kBtn">Kaydet</button></div></div>`;
  app.appendChild(ic);
  setTimeout(()=>{
    const inp=$("kInp"),btn=$("kBtn");
    btn.onclick=()=>{const v=parseFloat(inp.value);if(!v||isNaN(v))return;const t=new Date().toLocaleDateString("tr-TR",{day:"numeric",month:"short"});kiloLog.push({tarih:t,kg:v});saveAll();render()};
    inp.onkeydown=e=>{if(e.key==="Enter")btn.click()};
  },10);

  // Log
  if(kiloLog.length>0){
    const lc=el("div","cd");let lh=`<div class="hd"><span style="font-size:14px;font-weight:700">📝 Kayıtlar (${kiloLog.length})</span></div>`;
    kiloLog.slice().reverse().forEach((k,ri)=>{
      const i=kiloLog.length-1-ri;
      lh+=`<div style="display:flex;align-items:center;padding:10px 16px;border-bottom:1px solid #111318"><span style="font-size:13px;color:#9aa0ac;width:70px">${k.tarih}</span><span style="flex:1;font-size:15px;font-weight:700">${k.kg} kg</span><button class="btn btn-s" data-ki="${i}" style="background:rgba(248,113,113,.15);color:#f87171">Sil</button></div>`;
    });
    lc.innerHTML=lh;app.appendChild(lc);
    setTimeout(()=>{lc.querySelectorAll("[data-ki]").forEach(b=>{b.onclick=()=>{kiloLog.splice(parseInt(b.dataset.ki),1);saveAll();render()}})},10);
  }
}

function renderGym(app){
  // Week selector
  const ws=el("div","");ws.style.cssText="display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px";
  WK.forEach((w,i)=>{const b=el("button","",w.nm);b.style.cssText=`min-width:100px;padding:8px 10px;font-size:10px;font-weight:700;border-radius:8px;border:none;cursor:pointer;white-space:nowrap;background:${wkIdx===i?"#7c5cfc":"#1a1d24"};color:${wkIdx===i?"#fff":"#5f6673"}`;
    b.onclick=()=>{wkIdx=i;dayIdx=0;saveAll();render()};ws.appendChild(b)});
  app.appendChild(ws);

  // Day selector
  const ds=el("div","");ds.style.cssText="display:flex;gap:6px;margin-bottom:12px";
  WK[wkIdx].days.forEach((d,i)=>{const b=el("button","",d.d);b.style.cssText=`flex:1;padding:10px 0;font-size:13px;font-weight:700;border-radius:10px;border:none;cursor:pointer;background:${dayIdx===i?"#5e3ff5":"#1a1d24"};color:${dayIdx===i?"#fff":"#5f6673"}`;
    b.onclick=()=>{dayIdx=i;render()};ds.appendChild(b)});
  app.appendChild(ds);

  // Exercises
  const day=WK[wkIdx].days[dayIdx];
  const gc=el("div","cd");
  const gk=i=>dk()+"-"+wkIdx+"-"+dayIdx+"-"+i;
  const gDone=day.h.filter((_,i)=>gymCk[gk(i)]).length;
  let gh=`<div class="hd"><span style="font-size:14px;font-weight:700;color:#7c5cfc">${day.d} — ${WK[wkIdx].nm.split("—")[1]||""}</span><span style="font-size:12px;font-weight:600;color:${gDone===day.h.length?"#34d399":"#5f6673"}">${gDone}/${day.h.length}</span></div>`;
  gh+=`<div style="padding:6px 16px 4px"><div class="prg"><div class="prg-f" style="width:${(gDone/day.h.length)*100}%;background:${gDone===day.h.length?"#34d399":"#7c5cfc"}"></div></div></div>`;
  day.h.forEach((hr,i)=>{
    const dn=gymCk[gk(i)];
    gh+=`<div class="rw${dn?" dn":""}" data-gi="${i}"><div class="ck${dn?" on":""}">${dn?"✓":""}</div><div style="flex:1;min-width:0"><span style="font-size:14px;font-weight:600;color:${dn?"#5f6673":"#e8eaed"};text-decoration:${dn?"line-through":"none"}">${hr.a}</span><div style="font-size:11px;color:#5f6673;font-family:monospace;margin-top:2px">${hr.s}</div></div><a href="${hr.v}" target="_blank" rel="noopener noreferrer" class="vid" onclick="event.stopPropagation()">▶ Video</a></div>`;
  });
  gc.innerHTML=gh;
  gc.querySelectorAll(".rw").forEach(r=>{r.onclick=()=>{const i=parseInt(r.dataset.gi);gymCk[gk(i)]=!gymCk[gk(i)];saveAll();render()}});
  app.appendChild(gc);
}

// Init
render();
</script>
</body>
</html>
